# Ejemplo para la raíz del proyecto cuando frontend y backend están en carpetas hermanas.
# Si usan repositorios separados, cada repo lleva su propio compose y el BE Lead coordina el conjunto.
# Ajusta rutas y puertos con el BE Lead. Cuando exista el servidor de tiempo real (Sprint 2), se agrega como un tercer servicio.
services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    ports:
      - "3000:80"
    depends_on:
      - backend-api

  backend-api:
    build: ./backend-api
    ports:
      - "4000:4000"
    env_file:
      - ./backend-api/.env   # credenciales de Firebase: nunca en el repositorio
